<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="config.js"></script>

  <link rel="apple-touch-icon" sizes="180x180" href="asset/favicon-180x180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="asset/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="asset/favicon-16x16.png">
  <link rel="manifest" href="asset/site.webmanifest">
  <link rel="mask-icon" href="asset/favicon-512x512.png" color="#ffffff">
  <meta name="msapplication-TileColor" content="#ffffff">
  <meta name="msapplication-TileImage" content="asset/mstile-150x150.png">
  <!-- Light theme -->
  <meta name="theme-color" content="#0b2f57" media="(prefers-color-scheme: light)">
  <!-- Dark theme -->
  <meta name="theme-color" content="#0e141c" media="(prefers-color-scheme: dark)">

  <title>Future Assured - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #0b2f57;
      --navy-deep: #061a33;
      --brass: #c9a24b;
      --brass-soft: #e3c680;

      --bg: #eef2f7;
      --surface: #ffffff;
      --text: #14202e;
      --muted: #627084;
      --line: #d5dce6;
      --field: #f8fafc;
      --accent: #0b2f57;
      --accent-hover: #0a2748;
      --on-accent: #ffffff;
      --focus: #1c6fd1;
      --danger: #b3261e;
      --ok: #1b6e3c;
      --shadow: 0 1px 2px rgba(11, 47, 87, 0.06), 0 12px 32px -12px rgba(11, 47, 87, 0.22), 0 40px 80px -40px rgba(11, 47, 87, 0.3);

      --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
      --sans: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a1017;
        --surface: #121a25;
        --text: #e8edf3;
        --muted: #8f9eb2;
        --line: #263344;
        --field: #0c131c;
        --accent: #c9a24b;
        --accent-hover: #d6b25f;
        --on-accent: #1a1405;
        --focus: #7fb2f0;
        --danger: #ff9b94;
        --ok: #7fd9a0;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 20px 50px -20px rgba(0, 0, 0, 0.7);
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { height: 100%; }

    body {
      min-height: 100%;
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
    }

    .sr-only {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    svg.i {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: none;
    }

    .shell {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
    }

    /* ---------- Brand panel ---------- */
    .brand {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(110% 80% at 50% 110%, rgba(201, 162, 75, 0.2), transparent 60%),
        linear-gradient(165deg, var(--navy) 0%, var(--navy-deep) 100%);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: clamp(32px, 6vw, 96px);
    }

    .brand > * { position: relative; }

    /* The logo itself, large and faint behind the name */
    .brand > .mark {
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(82%, 560px);
      aspect-ratio: 1 / 1;
      background: url("logo.jpg") center / cover no-repeat;
      opacity: 0.2;
      mix-blend-mode: luminosity;
      -webkit-mask-image: radial-gradient(circle closest-side, #000 68%, transparent 100%);
              mask-image: radial-gradient(circle closest-side, #000 68%, transparent 100%);
      transform: translate(-50%, -50%);
      animation: breathe 16s ease-in-out infinite alternate;
      pointer-events: none;
    }

    /* Two thin rings that slowly widen and fade around the logo */
    .brand::before,
    .brand::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(82%, 560px);
      aspect-ratio: 1 / 1;
      border: 1px solid rgba(227, 198, 128, 0.55);
      border-radius: 50%;
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.8);
      animation: ring 9s ease-out infinite;
      pointer-events: none;
    }
    .brand::after { animation-delay: 4.5s; }

    @keyframes breathe {
      from { transform: translate(-50%, -50%) scale(1); }
      to   { transform: translate(-50%, -50%) scale(1.06); }
    }

    @keyframes ring {
      0%   { opacity: 0;   transform: translate(-50%, -50%) scale(0.8); }
      15%  { opacity: 0.5; }
      100% { opacity: 0;   transform: translate(-50%, -50%) scale(1.3); }
    }

    .brand h1 {
      font-family: var(--serif);
      font-weight: 500;
      font-size: clamp(2rem, 3.6vw, 3.25rem);
      line-height: 1.12;
      letter-spacing: -0.015em;
      max-width: 13ch;
      margin: 0 auto;
      text-align: center;
      text-shadow: 0 2px 24px rgba(3, 15, 30, 0.55);
    }

    .brand h1::after {
      content: "";
      display: block;
      width: 56px;
      height: 2px;
      margin: 28px auto 0;
      background: var(--brass);
    }

    /* ---------- Form panel ---------- */
    main {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 40px 36px 36px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
      animation: arrive 0.6s cubic-bezier(0.22, 0.61, 0.36, 1) both;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: none; }
    }

    .card h2 {
      margin-bottom: 28px;
      font-family: var(--serif);
      font-weight: 600;
      font-size: 2rem;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .control {
      position: relative;
      margin-bottom: 14px;
    }

    .control > .i {
      position: absolute;
      top: 50%;
      left: 16px;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
      transition: color 0.2s ease;
    }

    .control:focus-within > .i { color: var(--focus); }

    .card input {
      width: 100%;
      height: 54px;
      padding: 0 16px 0 48px;
      font: inherit;
      font-size: 1rem;
      color: var(--text);
      background: var(--field);
      border: 1px solid var(--line);
      border-radius: 12px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .card input::placeholder { color: var(--muted); opacity: 0.75; }

    .card input:hover { border-color: var(--muted); }

    .card input:focus {
      outline: none;
      background: var(--surface);
      border-color: var(--focus);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--focus) 22%, transparent);
    }

    .card input[aria-invalid="true"] { border-color: var(--danger); }

    .card input[aria-invalid="true"]:focus {
      border-color: var(--danger);
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--danger) 20%, transparent);
    }

    .card input:-webkit-autofill {
      -webkit-text-fill-color: var(--text);
      box-shadow: 0 0 0 100px var(--field) inset;
    }

    .control.has-toggle input { padding-right: 52px; }

    .reveal {
      position: absolute;
      top: 50%;
      right: 6px;
      transform: translateY(-50%);
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      color: var(--muted);
      background: transparent;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      transition: color 0.2s ease, background-color 0.2s ease;
    }

    .reveal:hover { color: var(--text); background: color-mix(in srgb, var(--muted) 14%, transparent); }
    .reveal:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
    .reveal .off { display: none; }
    .reveal.on .off { display: block; }
    .reveal.on .eye { display: none; }

    /* Inline message (errors and the welcome notice) */
    .alert {
      --tone: var(--danger);
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-top: 6px;
      padding: 12px 14px;
      font-size: 0.92rem;
      font-weight: 500;
      line-height: 1.4;
      color: var(--tone);
      background: color-mix(in srgb, var(--tone) 9%, transparent);
      border: 1px solid color-mix(in srgb, var(--tone) 32%, transparent);
      border-radius: 12px;
      animation: notice 0.25s ease-out both;
    }

    .alert[hidden] { display: none; }
    .alert.ok { --tone: var(--ok); }
    .alert svg.i { width: 18px; height: 18px; margin-top: 1px; }
    .alert .ico-ok { display: none; }
    .alert.ok .ico-ok { display: block; }
    .alert.ok .ico-err { display: none; }

    @keyframes notice {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: none; }
    }

    #loginBtn {
      width: 100%;
      height: 56px;
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font: inherit;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--on-accent);
      background: var(--accent);
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.18) inset, 0 12px 24px -10px color-mix(in srgb, var(--accent) 75%, transparent);
      transition: background-color 0.2s ease, transform 0.15s ease;
    }

    #loginBtn:hover { background: var(--accent-hover); }
    #loginBtn:active { transform: translateY(1px); }
    #loginBtn:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

    /* Spinner appears while the script is working (button text is not "Login") */
    #loginBtn[aria-busy="true"]::before {
      content: "";
      width: 16px;
      height: 16px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
      padding: 12px 24px 28px;
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
    }

    /* ---------- Small screens ---------- */
    @media (max-width: 860px) {
      .shell { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }

      .brand { min-height: 150px; padding: 36px 24px; }

      .brand > .mark,
      .brand::before,
      .brand::after { width: 260px; }

      .brand h1 { font-size: 1.35rem; max-width: none; }
      .brand h1::after { display: none; }

      .stage { align-items: flex-start; padding-top: 28px; }
    }

    @media (max-width: 480px) {
      .card { padding: 28px 20px 24px; border-radius: 16px; }
      .card h2 { font-size: 1.7rem; margin-bottom: 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card, .alert, .brand > .mark { animation: none; }
      .brand::before, .brand::after { animation: none; opacity: 0; }
      #loginBtn[aria-busy="true"]::before { animation-duration: 1.6s; }
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="brand">
      <div class="mark" aria-hidden="true"></div>
      <h1>Future Assured College Maiduguri</h1>
    </header>

    <main>
      <div class="stage">
        <div class="card">
          <h2>Sign in</h2>

          <div class="control">
            <label class="sr-only" for="email">Username</label>
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20.5c0-3.9 3.6-6 8-6s8 2.1 8 6"/></svg>
            <input type="email" id="email" placeholder="username@role" autocomplete="username" autocapitalize="none" spellcheck="false" required />
          </div>

          <div class="control has-toggle">
            <label class="sr-only" for="password">Password</label>
            <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
            <input type="password" id="password" placeholder="Password" autocomplete="current-password" required />
            <button type="button" class="reveal" id="revealBtn" aria-controls="password" aria-label="Show password">
              <svg class="i eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="i off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 6.1A10 10 0 0 1 12 6c6.4 0 10 6 10 6a17 17 0 0 1-3.2 3.9M6.6 6.7A16.7 16.7 0 0 0 2 12s3.6 6 10 6c1.6 0 3-.4 4.2-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
            </button>
          </div>

          <div class="alert" id="formError" role="alert" hidden>
            <svg class="i ico-err" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5"/><path d="M12 16.2v.01"/></svg>
            <svg class="i ico-ok" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg>
            <span id="errorText"></span>
          </div>

          <button id="loginBtn">Login</button>
        </div>
      </div>

      <footer>
        <small>©Mainafly 2025</small>
      </footer>
    </main>
  </div>

  <script>
    // Presentation only: show/hide password, Enter-to-submit, busy spinner
    (function () {
      var pw = document.getElementById("password");
      var reveal = document.getElementById("revealBtn");
      var btn = document.getElementById("loginBtn");

      reveal.addEventListener("click", function () {
        var show = pw.type === "password";
        pw.type = show ? "text" : "password";
        reveal.classList.toggle("on", show);
        reveal.setAttribute("aria-label", show ? "Hide password" : "Show password");
      });

      ["email", "password"].forEach(function (id) {
        document.getElementById(id).addEventListener("keydown", function (e) {
          if (e.key === "Enter") btn.click();
        });
      });

      function syncBusy() {
        btn.setAttribute("aria-busy", btn.textContent.trim() === "Login" ? "false" : "true");
      }
      new MutationObserver(syncBusy).observe(btn, { childList: true, characterData: true, subtree: true });
      syncBusy();
    })();
  </script>

    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-analytics.js";
  import {getFirestore, doc, setDoc, getDoc} from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";
  import {getAuth, createUserWithEmailAndPassword, updateProfile, deleteUser, onAuthStateChanged, signInWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";
     // import {getDatabase, set, ref, onValue, child, get } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-database.js";
        const firebaseConfig = {
  apiKey: "AIzaSyCm_DSZaYVQCt0ubBwRkE9nOTryJayxH0w",
  authDomain: "school-in-the-box.firebaseapp.com",
  projectId: "school-in-the-box",
  storageBucket: "school-in-the-box.firebasestorage.app",
  messagingSenderId: "596350496353",
  appId: "1:596350496353:web:84c66c351700ddf0824420",
  measurementId: "G-3MGCDH4FRF"
};

  // ---------- Inline messages (replace alert popups) ----------
  const formError = document.getElementById("formError");
  const errorText = document.getElementById("errorText");
  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");

  function clearMessage() {
    formError.hidden = true;
    formError.classList.remove("ok");
    errorText.textContent = "";
    emailInput.removeAttribute("aria-invalid");
    passwordInput.removeAttribute("aria-invalid");
  }

  function showMessage(text, type = "error", fields = []) {
    clearMessage();
    errorText.textContent = text;
    formError.classList.toggle("ok", type === "ok");
    formError.hidden = false;
    fields.forEach((f) => f.setAttribute("aria-invalid", "true"));
  }

  function messageFor(code) {
    switch (code) {
      case "auth/invalid-credential":
      case "auth/wrong-password":
      case "auth/user-not-found":
      case "auth/invalid-email":
      case "auth/missing-password":
      case "auth/email-already-in-use":
        return "Wrong username or password.";
      case "auth/too-many-requests":
        return "Too many attempts. Try again later.";
      case "auth/network-request-failed":
        return "No connection. Check your internet.";
      default:
        return "Couldn't sign in. Try again.";
    }
  }

  emailInput.addEventListener("input", clearMessage);
  passwordInput.addEventListener("input", clearMessage);

     loginBtn.textContent = "Please wait..";
//  const schoolId = "alhidayah";
    const app = initializeApp(firebaseConfig);
      const analytics = getAnalytics(app);
      const auth = getAuth(app);
  const db = getFirestore(app);
  
  let teachers = {};
  try {
    let teachersRef = doc(db, schoolId, "teachers");
    let teacherDoc = await getDoc(teachersRef);
    teachers = teacherDoc.exists()? teacherDoc.data() : {};
  } catch (e) {
    showMessage("No connection. Check your internet and refresh.");
  }

      loginBtn.textContent = "Login";
  var schoolGeneratedUsername;
  
 async function onLoginSuccess(user, role) {
  
   
   if (!teachers[schoolGeneratedUsername]){
     if (!(user.email=="dev@teacher."+schoolId)){
    // await deleteUser(user);
     showMessage("Not on the staff list. Ask your admin.", "error", [emailInput]);
     loginBtn.textContent = "Login";
     return;
     }
   }
 
   
   
    
   
   if (role=="admin"){
        window.location.href = "admin/admin.html";
        return
      }
      if (role=="teacher"){
        window.location.href = "teacher/index.html";
        return
      }
      if (role=="student"){
        window.location.href = "student/index.html";
        return
      }
      if (role=="guardian"){
        window.location.href = "guardian/index.html";
        return
      }
      if (role=="alumni"){
        window.location.href = "alumni/index.html";
        return
      }
      
      // no matching role: tell the user instead of failing silently
      showMessage("Add your role after the @, like amina@teacher.", "error", [emailInput]);
      loginBtn.textContent = "Login";
      // redirect or load user-specific content here
    }
  
  const logBtn = document.getElementById("loginBtn");
  logBtn.onclick = signIn;

  let reg = /.*@/;
  
  async function signIn() {
      clearMessage();
      logBtn.textContent = "Logging..";
      const username = document.getElementById("email").value;
      const email = username.replace(/@.*/, "")+`@teacher.${schoolId}`;
     schoolGeneratedUsername = username.replace(/@.*/, "");
      const role = username.replace(reg, "");
      const password = document.getElementById("password").value;
   
      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          onLoginSuccess(userCredential.user, role);
          logBtn.textContent = "Login";
        })
        .catch( async (error) => {
          let user = teachers[schoolGeneratedUsername];
          
          if (user && user.psw==password){
              try {
                await createUserWithEmailAndPassword(auth, email, password);
                let createdUser = auth.currentUser;
            
                await updateProfile(createdUser, {displayName: user.name});
                showMessage("Welcome, " + user.name, "ok");
                onLoginSuccess(createdUser, role);
              } catch (e) {
                showMessage(messageFor(e.code), "error", [emailInput, passwordInput]);
                logBtn.textContent = "Login";
              }
              return;
      
          }
          showMessage(messageFor(error.code), "error", [emailInput, passwordInput]);
          logBtn.textContent = "Login";
        });
    }

      
      
  </script>
  
</body>
